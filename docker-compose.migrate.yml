# CUTOVER ONLY — never merge this overlay into production steady-state.
#
# This VPS co-hosts Flowey, which already binds host 5432. ReloadSOL migrate/psql
# from the host uses 127.0.0.1:5433 → container 5432.
#
# Production compose (docker-compose.yml + docker-compose.prod.yml) must NOT
# publish Postgres to the host. scripts/start-db-stack.sh, scripts/docker-deploy.sh,
# and scripts/docker-up.sh never include this file.
#
# Usage (cutover only):
#   docker compose -f docker-compose.yml -f docker-compose.migrate.yml up -d reloadsol-db reloadsol-bouncer
#   psql "postgresql://postgres:…@127.0.0.1:5433/reloadsol_db"
#
# After cutover, unpublish 5433 by bringing db up without this overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d reloadsol-db reloadsol-bouncer

services:
  reloadsol-db:
    ports:
      - "127.0.0.1:5433:5432"
