<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReloadSOL · Trade confirmation lifecycle</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#fafaf7; --paper2:#f0efe9; --ink:#163b2a; --muted:#5b6b60;
    --soft:#8a968d; --accent:#84cc16; --link:#2e5aa8;
    --sans:'DM Sans', system-ui, sans-serif;
    --serif:'Fraunces', serif;
    --mono:'Geist Mono', ui-monospace, monospace;
  }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); padding:3rem 2rem; }
  .frame { max-width:1200px; margin:0 auto; }
  .eyebrow { font-family:var(--mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }
  h1 { font-family:var(--serif); font-size:clamp(1.4rem,2.2vw+.5rem,1.9rem); font-weight:400; letter-spacing:-.02em; color:var(--ink); margin-bottom:1.25rem; }
  svg { width:100%; min-width:920px; display:block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ReloadSOL · Sequence</p>
  <h1>Trade confirmation waits for the on-chain receipt</h1>

  <svg viewBox="0 0 1160 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cl-title cl-desc">
    <title id="cl-title">Trade confirmation lifecycle</title>
    <desc id="cl-desc">Sequence showing a swap written as pending, then resolved to confirmed or failed only after the on-chain receipt settles, and the history feed refreshed over SSE.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5b6b60"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#84cc16"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#fafaf7"/>

    <!-- Lifelines -->
    <line x1="140" y1="148" x2="140" y2="700" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="340" y1="148" x2="340" y2="700" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="560" y1="148" x2="560" y2="700" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="148" x2="800" y2="700" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="1020" y1="148" x2="1020" y2="700" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bar on Executor: submit ~200 to receipt ~420 -->
    <rect x="796" y="200" width="8" height="224" fill="rgba(22,59,42,0.06)" stroke="#5b6b60" stroke-width="0.8"/>

    <!-- Actor boxes -->
    <rect x="56" y="84" width="168" height="52" rx="6" fill="#fafaf7"/>
    <rect x="56" y="84" width="168" height="52" rx="6" fill="rgba(22,59,42,0.03)" stroke="rgba(22,59,42,0.30)" stroke-width="1"/>
    <rect x="64" y="92" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.22)" stroke-width="0.8"/>
    <text x="82" y="101" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="140" y="116" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">User / Rabby</text>

    <rect x="256" y="84" width="168" height="52" rx="6" fill="#fafaf7"/>
    <rect x="256" y="84" width="168" height="52" rx="6" fill="rgba(22,59,42,0.03)" stroke="rgba(22,59,42,0.30)" stroke-width="1"/>
    <rect x="264" y="92" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.22)" stroke-width="0.8"/>
    <text x="282" y="101" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="340" y="116" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Confirm modal</text>

    <rect x="456" y="84" width="208" height="52" rx="6" fill="#fafaf7"/>
    <rect x="456" y="84" width="208" height="52" rx="6" fill="rgba(22,59,42,0.03)" stroke="rgba(22,59,42,0.30)" stroke-width="1"/>
    <rect x="464" y="92" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.22)" stroke-width="0.8"/>
    <text x="482" y="101" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="560" y="116" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Trading records</text>

    <rect x="672" y="84" width="256" height="52" rx="6" fill="#fafaf7"/>
    <rect x="672" y="84" width="256" height="52" rx="6" fill="rgba(132,204,22,0.12)" stroke="#84cc16" stroke-width="1"/>
    <rect x="680" y="92" width="40" height="12" rx="2" fill="transparent" stroke="rgba(132,204,22,0.50)" stroke-width="0.8"/>
    <text x="700" y="101" fill="#84cc16" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">EXEC</text>
    <text x="800" y="116" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Executor (Kyber / GMGN)</text>

    <rect x="904" y="84" width="200" height="52" rx="6" fill="#fafaf7"/>
    <rect x="904" y="84" width="200" height="52" rx="6" fill="rgba(22,59,42,0.03)" stroke="rgba(22,59,42,0.30)" stroke-width="1"/>
    <rect x="912" y="92" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.22)" stroke-width="0.8"/>
    <text x="930" y="101" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="1020" y="116" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">History feed (SSE)</text>

    <!-- Messages -->
    <!-- 1 user->modal submit -->
    <line x1="140" y1="200" x2="340" y2="200" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="140" y="180" width="56" height="12" rx="2" fill="#fafaf7"/>
    <text x="168" y="189" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>

    <!-- 2 modal->records write pending -->
    <path d="M 340,260 H 552 Q 560,260 560,252 V 240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="372" y="240" width="76" height="12" rx="2" fill="#fafaf7"/>
    <text x="410" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PENDING</text>

    <!-- 3 modal->executor send -->
    <path d="M 340,320 H 792 Q 800,320 800,312 V 300" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="560" y="300" width="88" height="12" rx="2" fill="#fafaf7"/>
    <text x="604" y="309" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SIGN+SEND</text>

    <!-- 4 executor self-loop wait receipt -->
    <path d="M 800,360 C 852,360 852,400 800,400" fill="none" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="812" y="384" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace">waitForTransactionReceipt</text>

    <!-- ALT fragment -->
    <rect x="480" y="424" width="556" height="196" rx="4" fill="rgba(22,59,42,0.02)" stroke="rgba(22,59,42,0.22)" stroke-width="1"/>
    <rect x="480" y="424" width="48" height="16" rx="2" fill="#fafaf7" stroke="rgba(22,59,42,0.22)" stroke-width="1"/>
    <text x="504" y="436" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

    <!-- Region 1: reverted -->
    <text x="492" y="464" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">[reverted / rejected]</text>
    <path d="M 800,488 H 568 Q 560,488 560,496 V 508" fill="none" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="604" y="476" width="92" height="12" rx="2" fill="#fafaf7"/>
    <text x="650" y="485" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REVERTED</text>
    <line x1="560" y1="536" x2="1020" y2="536" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="740" y="516" width="76" height="12" rx="2" fill="#fafaf7"/>
    <text x="778" y="525" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FAILED</text>

    <!-- divider -->
    <line x1="488" y1="560" x2="1028" y2="560" stroke="rgba(22,59,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Region 2: confirmed -->
    <text x="492" y="584" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.04em">[receipt success]</text>
    <path d="M 800,608 H 568 Q 560,608 560,616 V 628" fill="none" stroke="#84cc16" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="604" y="596" width="104" height="12" rx="2" fill="#fafaf7"/>
    <text x="656" y="605" fill="#84cc16" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMED</text>
    <line x1="560" y1="656" x2="1020" y2="656" stroke="#84cc16" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="720" y="636" width="112" height="12" rx="2" fill="#fafaf7"/>
    <text x="776" y="645" fill="#84cc16" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">HISTORY REFRESH</text>

    <!-- Legend -->
    <line x1="56" y1="724" x2="1104" y2="724" stroke="rgba(22,59,42,0.10)" stroke-width="0.8"/>
    <text x="56" y="740" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
    <line x1="56" y1="756" x2="160" y2="756" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="168" y="759" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">call</text>
    <line x1="252" y1="756" x2="356" y2="756" stroke="#84cc16" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="364" y="759" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">confirmed</text>
    <line x1="476" y1="756" x2="580" y2="756" stroke="#5b6b60" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="588" y="759" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">lifeline</text>
    <rect x="700" y="750" width="16" height="12" rx="2" fill="rgba(22,59,42,0.02)" stroke="rgba(22,59,42,0.22)" stroke-width="1"/>
    <text x="724" y="759" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">alt region</text>
  </svg>
</div>
</body>
</html>
