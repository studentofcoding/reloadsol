<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReloadSOL · Deploy runbook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#fafaf7; --paper2:#f0efe9; --ink:#163b2a; --muted:#5b6b60;
    --soft:#8a968d; --accent:#84cc16; --link:#2e5aa8;
    --sans:'DM Sans', system-ui, sans-serif;
    --serif:'Fraunces', serif;
    --mono:'Geist Mono', ui-monospace, monospace;
  }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); padding:3rem 2rem; }
  .frame { max-width:1200px; margin:0 auto; }
  .eyebrow { font-family:var(--mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }
  h1 { font-family:var(--serif); font-size:clamp(1.4rem,2.2vw+.5rem,1.9rem); font-weight:400; letter-spacing:-.02em; color:var(--ink); margin-bottom:1.25rem; }
  svg { width:100%; min-width:920px; display:block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ReloadSOL · Deploy</p>
  <h1>Web deploy runbook — old container keeps serving</h1>

  <svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dep-title dep-desc">
    <title id="dep-title">Web deploy runbook</title>
    <desc id="dep-desc">Flow of a web deploy: pull, host build, verify the standalone bundle, build the image, recreate the container, health check with rollback on failure, then warm the cache.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5b6b60"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#84cc16"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#fafaf7"/>

    <!-- Arrows -->
    <line x1="470" y1="148" x2="470" y2="188" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="470" y1="252" x2="470" y2="292" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- decision -> build image (down) -->
    <line x1="470" y1="392" x2="470" y2="444" stroke="#84cc16" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="416" y="404" width="56" height="12" rx="2" fill="#fafaf7"/>
    <text x="444" y="413" fill="#84cc16" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

    <!-- decision -> rollback (right) -->
    <path d="M 600,356 H 736 Q 744,356 744,348 V 316" fill="none" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="604" y="328" width="40" height="12" rx="2" fill="#fafaf7"/>
    <text x="624" y="337" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

    <!-- build image -> recreate -->
    <line x1="470" y1="508" x2="470" y2="548" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- recreate -> health -->
    <line x1="470" y1="612" x2="470" y2="636" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- rollback -> done (right, dashed) -->
    <path d="M 660,292 H 660" fill="none" stroke="#5b6b60" stroke-width="0"/>

    <!-- Nodes -->
    <rect x="358" y="84" width="224" height="64" rx="6" fill="#fafaf7"/>
    <rect x="358" y="84" width="224" height="64" rx="6" fill="#ffffff" stroke="#163b2a" stroke-width="1"/>
    <rect x="366" y="92" width="44" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.40)" stroke-width="0.8"/>
    <text x="388" y="101" fill="#163b2a" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
    <text x="470" y="120" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">git pull</text>
    <text x="470" y="136" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">origin/main</text>

    <rect x="330" y="188" width="280" height="64" rx="6" fill="#fafaf7"/>
    <rect x="330" y="188" width="280" height="64" rx="6" fill="#ffffff" stroke="#163b2a" stroke-width="1"/>
    <rect x="338" y="196" width="48" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.40)" stroke-width="0.8"/>
    <text x="362" y="205" fill="#163b2a" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
    <text x="470" y="224" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Host build</text>
    <text x="470" y="240" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">SKIP_BUILD_CHECKS=true · next build</text>

    <rect x="330" y="292" width="280" height="64" rx="6" fill="#fafaf7"/>
    <rect x="330" y="292" width="280" height="64" rx="6" fill="#ffffff" stroke="#163b2a" stroke-width="1"/>
    <rect x="338" y="300" width="48" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.40)" stroke-width="0.8"/>
    <text x="362" y="309" fill="#163b2a" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
    <text x="470" y="328" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Verify standalone</text>
    <text x="470" y="344" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">.next/standalone + onnx libs</text>

    <!-- Rollback box (right) -->
    <rect x="744" y="232" width="188" height="84" rx="6" fill="#fafaf7"/>
    <rect x="744" y="232" width="188" height="84" rx="6" fill="rgba(22,59,42,0.03)" stroke="rgba(22,59,42,0.30)" stroke-width="1"/>
    <rect x="752" y="240" width="52" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.22)" stroke-width="0.8"/>
    <text x="778" y="249" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>
    <text x="838" y="276" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Rollback web</text>
    <text x="838" y="292" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">previous web image</text>

    <rect x="358" y="444" width="224" height="64" rx="6" fill="#fafaf7"/>
    <rect x="358" y="444" width="224" height="64" rx="6" fill="rgba(132,204,22,0.12)" stroke="#84cc16" stroke-width="1"/>
    <rect x="366" y="452" width="48" height="12" rx="2" fill="transparent" stroke="rgba(132,204,22,0.50)" stroke-width="0.8"/>
    <text x="390" y="461" fill="#84cc16" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DOCKER</text>
    <text x="470" y="480" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Build web image</text>
    <text x="470" y="496" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">docker compose build web</text>

    <rect x="342" y="548" width="256" height="64" rx="6" fill="#fafaf7"/>
    <rect x="342" y="548" width="256" height="64" rx="6" fill="rgba(132,204,22,0.12)" stroke="#84cc16" stroke-width="1"/>
    <rect x="350" y="556" width="48" height="12" rx="2" fill="transparent" stroke="rgba(132,204,22,0.50)" stroke-width="0.8"/>
    <text x="374" y="565" fill="#84cc16" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DOCKER</text>
    <text x="470" y="584" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">Recreate web</text>
    <text x="470" y="600" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">up -d --no-deps web · cron stays up</text>

    <!-- Health / Done -->
    <rect x="358" y="636" width="224" height="56" rx="6" fill="#fafaf7"/>
    <rect x="358" y="636" width="224" height="56" rx="6" fill="rgba(22,59,42,0.05)" stroke="#5b6b60" stroke-width="1"/>
    <rect x="366" y="644" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
    <text x="388" y="653" fill="#5b6b60" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HEALTH</text>
    <text x="470" y="670" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">warm-cache + done</text>

    <!-- Legend -->
    <line x1="48" y1="504" x2="932" y2="504" stroke="rgba(22,59,42,0.10)" stroke-width="0.8"/>
    <text x="48" y="520" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="48" y="536" width="14" height="10" rx="2" fill="rgba(132,204,22,0.12)" stroke="#84cc16" stroke-width="1"/>
    <text x="68" y="544" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">Focal step</text>
    <rect x="160" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#163b2a" stroke-width="1"/>
    <text x="180" y="544" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">Step</text>
    <line x1="276" y1="541" x2="304" y2="541" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="312" y="544" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">pass / next</text>
    <line x1="420" y1="541" x2="448" y2="541" stroke="#84cc16" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="456" y="544" fill="#5b6b60" font-size="8.5" font-family="'DM Sans',sans-serif">primary path</text>
  </svg>
</div>
</body>
</html>
