<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReloadSOL · Strategy engine</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#fafaf7; --paper2:#f0efe9; --ink:#163b2a; --muted:#5b6b60;
    --soft:#8a968d; --accent:#84cc16; --link:#2e5aa8;
    --sans:'DM Sans', system-ui, sans-serif;
    --serif:'Fraunces', serif;
    --mono:'Geist Mono', ui-monospace, monospace;
  }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); padding:3rem 2rem; }
  .frame { max-width:1200px; margin:0 auto; }
  .eyebrow { font-family:var(--mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }
  h1 { font-family:var(--serif); font-size:clamp(1.4rem,2.2vw+.5rem,1.9rem); font-weight:400; letter-spacing:-.02em; color:var(--ink); margin-bottom:1.25rem; }
  svg { width:100%; min-width:920px; display:block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">ReloadSOL · Automation</p>
  <h1>Strategy engine: definition → worker → outcome → signal</h1>

  <svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="se-title se-desc">
    <title id="se-title">Strategy engine spine</title>
    <desc id="se-desc">Data flow from strategy definitions to the Go cron to workers that open and close sim or live positions, recording outcomes that feed reporting and ML shadow scoring.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5b6b60"/></marker>

    </defs>
    <rect width="100%" height="100%" fill="#fafaf7"/>

    <!-- Arrows -->
    <line x1="240" y1="200" x2="312" y2="200" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="236" y="180" width="52" height="12" rx="2" fill="#fafaf7"/>
    <text x="262" y="189" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

    <line x1="408" y1="200" x2="480" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="404" y="180" width="52" height="12" rx="2" fill="#fafaf7"/>
    <text x="430" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">TICK</text>

    <line x1="576" y1="200" x2="648" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="572" y="180" width="52" height="12" rx="2" fill="#fafaf7"/>
    <text x="598" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

    <!-- worker -> outcome store -->
    <path d="M 744,200 H 880 Q 888,200 888,208 V 260" fill="none" stroke="#5b6b60" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="752" y="216" width="64" height="12" rx="2" fill="#fafaf7"/>
    <text x="784" y="225" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLOSE</text>

    <text x="906" y="261" fill="#5b6b60" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ALERT</text>

    <path d="M 1008,376 H 588 Q 588,376 588,368 V 248" fill="none" stroke="#5b6b60" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <text x="74" y="361" fill="#163b2a" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>

    <rect x="944" y="344" width="164" height="64" rx="6" fill="#fafaf7"/>

    <rect x="952" y="352" width="36" height="12" rx="2" fill="transparent" stroke="rgba(22,59,42,0.40)" stroke-width="0.8"/>
    <text x="970" y="361" fill="#163b2a" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ML</text>
    <text x="1026" y="380" fill="#163b2a" font-size="12" font-weight="600" font-family="'DM Sans',sans-serif" text-anchor="middle">ML shadow scoring</text>
    <text x="1026" y="396" fill="#5b6b60" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ONNX · entry features</text>
