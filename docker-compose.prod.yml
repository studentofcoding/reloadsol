# Production overrides — run detached with stricter restart policy
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  web:
    restart: always
    environment:
      NODE_ENV: production
    ports: !override []

  nginx:
    restart: always
    ports: !override
      - "80:80"

  cron:
    restart: always
    # !override replaces base docker-compose.yml ports (avoid double-bind on same host port)
    ports: !override
      - "127.0.0.1:8080:8080"

  social-ingest:
    restart: always
