# reloadSOL full stack — Next.js web + Go cron (trending, DLMM, SL/TP, etc.)
#
# One command (recommended):
#   cp .env.docker.example .env && npm run docker:up
#
# Manual (install + build + up):
#   bash scripts/docker-install.sh && npm run build && docker compose up --build
#
# Dev hot-reload:  npm run docker:dev        (web only)
# Dev + cron:      npm run docker:dev:full
# Production:      npm run docker:prod
#
# Postgres is internal-only (no host ports). This VPS co-hosts Flowey on
# 127.0.0.1:5432. Cutover-only host access: docker-compose.migrate.yml →
# 127.0.0.1:5433. Never merge migrate.yml into steady-state deploy.

# Rotate container logs (json-file has NO limit by default; /etc/docker/daemon.json is absent on the VPS).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  reloadsol-db:
    image: postgres:16-alpine
    container_name: reloadsol-db
    restart: unless-stopped
    logging: *default-logging
    # Keep the DB resident: memory+swap capped at the limit => no container swap.
    memswap_limit: 1G
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reloadsol_db}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=24MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reloadsol_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reloadsol

  redis:
    image: redis:7-alpine
    container_name: reloadsol-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - reloadsol

  reloadsol-bouncer:
    image: edoburu/pgbouncer:latest
    container_name: reloadsol-bouncer
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: reloadsol-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-reloadsol_db}
      # Postgres 14+ uses SCRAM; edoburu/pgbouncer defaults to md5 without this
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 30
    depends_on:
      reloadsol-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 64M was too tight: kernel socket buffers for ~200 client conns + transaction
    # pooling bursts counted against the cgroup (~68MB) and the OOM killer kept
    # restarting pgbouncer (~270 restarts). 256M gives headroom; swap pinned equal
    # to the limit so the container cannot spill into host swap.
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - reloadsol

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: reloadsol-web
    # Keep the app resident (V8 heap is capped below); no container swap.
    memswap_limit: 768M
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TRENDING_TRACKER_SECRET: ${TRENDING_TRACKER_SECRET:?set TRENDING_TRACKER_SECRET in .env (no default; see .env.docker.example)}
      NODE_ENV: production
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=512}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Cron hits this internal URL when both run in compose
      NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:3000}
      API_HOST: ${API_HOST:-http://web:3000}
      # Workers tab + /api/workers/status (web container → cron service name)
      CRON_SERVICE_URL: ${CRON_SERVICE_URL:-http://cron:8080}
      # Pattern/v2-gate ONNX — host-trained artifacts mounted at /app/ml/artifacts (see volumes)
      ML_PATTERN_ARTIFACT_DIR: ${ML_PATTERN_ARTIFACT_DIR:-/app/ml/artifacts/pattern-gate}
      ML_CLOSED_LOOP: ${ML_CLOSED_LOOP:-0}
      ML_CLOSED_LOOP_ARTIFACT: ${ML_CLOSED_LOOP_ARTIFACT:-/app/data/ml-closed-loop/model.json}
      EVAL_ENGINE: ${EVAL_ENGINE:-0}
      EVAL_SHADOW: ${EVAL_SHADOW:-1}
      EVAL_EXEC_MODE: ${EVAL_EXEC_MODE:-paper}
      LIVE_TRADE_ENABLED: ${LIVE_TRADE_ENABLED:-0}
      # DATABASE_URL from .env (bouncer host; URL-encode password if it contains @ # : %)
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
      - ./data/ml-closed-loop:/app/data/ml-closed-loop
    depends_on:
      redis:
        condition: service_healthy
      reloadsol-bouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Docker's default 10 s SIGKILLs a web that is still finishing a sim-track / SL-TP cycle (and its job lock).
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - reloadsol

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: reloadsol-cron
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TRENDING_TRACKER_SECRET: ${TRENDING_TRACKER_SECRET:?set TRENDING_TRACKER_SECRET in .env (no default; see .env.docker.example)}
      API_BASE_URL: http://web:3000
      PORT: 8080
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - reloadsol

  nginx:
    image: nginx:1.27-alpine
    container_name: reloadsol-nginx
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--header=Host: reloadsol.app", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - reloadsol

  social-ingest:
    build:
      context: .
      dockerfile: social-ingest/Dockerfile
    container_name: reloadsol-social-ingest
    env_file:
      - .env
    environment:
      TRENDING_TRACKER_SECRET: ${TRENDING_TRACKER_SECRET:?set TRENDING_TRACKER_SECRET in .env (no default; see .env.docker.example)}
      SOCIAL_INGEST_URL: http://web:3000/api/social/ingest
      SESSION_DIR: /app/sessions
      SOCIAL_SESSION_NAME: session_search
    volumes:
      - ./social-ingest/sessions:/app/sessions
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - reloadsol

networks:
  reloadsol:
    driver: bridge

volumes:
  postgres_data:
  nginx_cache:
  redis_data:
