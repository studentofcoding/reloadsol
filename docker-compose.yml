# reloadSOL full stack — Next.js web + Go cron (trending, DLMM, SL/TP, etc.)
#
# One command (recommended):
#   cp .env.docker.example .env && npm run docker:up
#
# Manual (install + build + up):
#   bash scripts/docker-install.sh && npm run build && docker compose up --build
#
# Dev hot-reload:  npm run docker:dev        (web only)
# Dev + cron:      npm run docker:dev:full
# Production:      npm run docker:prod

services:
  reloadsol-db:
    image: postgres:16-alpine
    container_name: reloadsol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reloadsol_db}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reloadsol_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reloadsol

  redis:
    image: redis:7-alpine
    container_name: reloadsol-redis
    restart: unless-stopped
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - reloadsol

  reloadsol-bouncer:
    image: edoburu/pgbouncer:latest
    container_name: reloadsol-bouncer
    restart: unless-stopped
    environment:
      DB_HOST: reloadsol-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-reloadsol_db}
      # Postgres 14+ uses SCRAM; edoburu/pgbouncer defaults to md5 without this
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 30
    depends_on:
      reloadsol-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - reloadsol

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: reloadsol-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Cron hits this internal URL when both run in compose
      NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:3000}
      API_HOST: ${API_HOST:-http://web:3000}
      # Workers tab + /api/workers/status (web container → cron service name)
      CRON_SERVICE_URL: ${CRON_SERVICE_URL:-http://cron:8080}
      # DATABASE_URL from .env (bouncer host; URL-encode password if it contains @ # : %)
    depends_on:
      redis:
        condition: service_healthy
      reloadsol-bouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - reloadsol

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: reloadsol-cron
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://web:3000
      PORT: 8080
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - reloadsol

  nginx:
    image: nginx:1.27-alpine
    container_name: reloadsol-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - reloadsol

  social-ingest:
    build:
      context: .
      dockerfile: social-ingest/Dockerfile
    container_name: reloadsol-social-ingest
    env_file:
      - .env
    environment:
      SOCIAL_INGEST_URL: http://web:3000/api/social/ingest
      SESSION_DIR: /app/sessions
      SOCIAL_SESSION_NAME: session_search
    volumes:
      - ./social-ingest/sessions:/app/sessions
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - reloadsol

networks:
  reloadsol:
    driver: bridge

volumes:
  postgres_data:
  nginx_cache:
