# reloadsol RH wallet ledger — live tail (transfers + balances)
#
# Two dataset sources in ONE pipeline (Starter plan = 1 pipeline):
#   1. robinhood_mainnet.erc20_transfers  → rh_ledger_transfers  (history/PnL)
#   2. robinhood_mainnet.balances         → rh_wallet_balances    (exact holdings)
# Both deliver through the same secret-gated webhook; the ingest route
# dispatches by row shape (balance rows carry owner_address/contract_address).
#
# Deploy: see scripts/goldsky-rh-ledger-deploy.sh and goldsky/README.md.
# Placeholders: <WALLET_WHERE>, <WALLET_BAL>, <APP_HOST>, <WEBHOOK_SECRET_NAME>.
name: reloadsol-rh-wallet-ledger
resource_size: s
sources:
  rh_erc20:
    type: dataset
    dataset_name: robinhood_mainnet.erc20_transfers
    version: 1.1.0
    start_at: latest
  rh_balances:
    type: dataset
    dataset_name: robinhood_mainnet.balances
    version: 1.1.0
    start_at: latest
transforms:
  watched_wallet_transfers:
    type: sql
    primary_key: id
    sql: |
      SELECT id, address, sender, recipient, amount,
             block_number, block_timestamp, transaction_hash, log_index
      FROM rh_erc20
      WHERE <WALLET_WHERE>
        AND amount > 0
  watched_balances:
    type: sql
    primary_key: id
    sql: |
      SELECT id, owner_address, contract_address, token_id, token_type,
             balance, block_number, block_timestamp
      FROM rh_balances
      WHERE owner_address = '<WALLET_BAL>'
        AND token_type = 'ERC_20'
sinks:
  ledger_webhook:
    type: webhook
    from: watched_wallet_transfers
    url: https://<APP_HOST>/api/rh/ledger/ingest
    secret_name: <WEBHOOK_SECRET_NAME>
    batch_flush_interval: 1s
  balances_webhook:
    type: webhook
    from: watched_balances
    url: https://<APP_HOST>/api/rh/ledger/ingest
    secret_name: <WEBHOOK_SECRET_NAME>
    batch_flush_interval: 1s
