upstream reloadsol_web {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  add_header X-Cache-Status $upstream_cache_status always;

  location /_next/static/ {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 365d;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/solprice {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/rpc/health {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/tokens/prices {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 30s;
    proxy_cache_methods GET;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/jupiter/portfolio {
    proxy_cache reloadsol_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$arg_wallet";
    proxy_cache_valid 200 15s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/trending/stats {
    set $skip_cache 0;
    if ($arg_nocache = true) { set $skip_cache 1; }
    proxy_cache reloadsol_cache;
    proxy_cache_bypass $skip_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location = /api/trending {
    set $skip_cache 0;
    if ($arg_nocache = true) { set $skip_cache 1; }
    if ($arg_cache = off) { set $skip_cache 1; }
    proxy_cache reloadsol_cache;
    proxy_cache_bypass $skip_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://reloadsol_web;
  }

  location /api/trading/subscribe {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_pass http://reloadsol_web;
  }

  location /api/trading/ {
    proxy_cache off;
    proxy_pass http://reloadsol_web;
  }

  location /api/jupiter/ultra/ {
    proxy_cache off;
    proxy_pass http://reloadsol_web;
  }

  location /api/solanatracker/ {
    proxy_cache off;
    proxy_pass http://reloadsol_web;
  }

  location / {
    proxy_pass http://reloadsol_web;
  }
}
