# reloadsol.app — TLS at Cloudflare; origin HTTP :80
# Variable proxy_pass + resolver (see nginx.conf) so `web` re-resolves after recreate.

server {
  listen 80;
  server_name reloadsol.app www.reloadsol.app;

  client_max_body_size 20m;

  set $reloadsol_upstream web:3000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  add_header X-Cache-Status $upstream_cache_status always;

  location /_next/static/ {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 365d;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/solprice {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/rpc/health {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/tokens/prices {
    proxy_cache reloadsol_cache;
    proxy_cache_valid 200 30s;
    proxy_cache_methods GET;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/jupiter/portfolio {
    proxy_cache reloadsol_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$arg_wallet";
    proxy_cache_valid 200 15s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/trending/stats {
    set $skip_cache 0;
    if ($arg_nocache = true) { set $skip_cache 1; }
    proxy_cache reloadsol_cache;
    proxy_cache_bypass $skip_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location = /api/trending {
    set $skip_cache 0;
    if ($arg_nocache = true) { set $skip_cache 1; }
    if ($arg_cache = off) { set $skip_cache 1; }
    proxy_cache reloadsol_cache;
    proxy_cache_bypass $skip_cache;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_pass http://$reloadsol_upstream;
  }

  location /api/trading/subscribe {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_pass http://$reloadsol_upstream;
  }

  location /api/trading/ {
    proxy_cache off;
    proxy_pass http://$reloadsol_upstream;
  }

  location /api/jupiter/ultra/ {
    proxy_cache off;
    proxy_pass http://$reloadsol_upstream;
  }

  location /api/solanatracker/ {
    proxy_cache off;
    proxy_pass http://$reloadsol_upstream;
  }

  # Pass API cache policy through unchanged. The document rule below must not
  # replace route-handler cache headers.
  location /api/ {
    proxy_cache off;
    proxy_pass http://$reloadsol_upstream;
  }

  location / {
    # Next marks fully prerendered documents with a one-year s-maxage. That is
    # unsafe for deploy-specific HTML/RSC shells behind Cloudflare.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
    proxy_pass http://$reloadsol_upstream;
  }
}
