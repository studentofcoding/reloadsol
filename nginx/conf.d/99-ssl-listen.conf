# Origin HTTPS for Cloudflare Full / Full (strict with Origin CA later).
# Same vhosts as :80 — TLS terminates here; proxy stays HTTP to upstreams.
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/certs/origin.crt;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 444;
}
