# flowey.space + vs.flowey.space — TLS at Cloudflare; origin HTTP :80
# Upstreams: compose aliases on reloadsol_reloadsol (flowey docker-compose.vps.yml)
# Variable proxy_pass + resolver (nginx.conf) avoids stale IP → 502 after recreate.

server {
  listen 80;
  server_name flowey.space;

  client_max_body_size 1m;

  set $flowey_api_upstream flowey-api:8787;

  location / {
    proxy_pass http://$flowey_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

server {
  listen 80;
  server_name vs.flowey.space;

  set $flowey_livekit_upstream flowey-livekit:7880;

  location / {
    proxy_pass http://$flowey_livekit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}
