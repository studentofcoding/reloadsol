# terminal.reloadsol.app → btc-sentiment
# TLS at Cloudflare (same as reloadsol). Variable proxy_pass re-resolves after recreate.

server {
  listen 80;
  server_name terminal.reloadsol.app;

  client_max_body_size 20m;

  set $terminal_upstream btc-sentiment:8787;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /api/ {
    proxy_pass http://$terminal_upstream;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = / {
    proxy_pass http://$terminal_upstream/index.html;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://$terminal_upstream;
    proxy_read_timeout 120s;
  }
}
